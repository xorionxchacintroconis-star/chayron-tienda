<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chayron | Tienda de Zapatillas</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="header">
  <div class="header__top">
    <a href="index.html" class="logo">
      <img src="logo.png" alt="Chayron" />
    </a>
    <div class="search-bar">
      <span class="icono-buscar">🔍</span>
      <input type="text" id="buscador" placeholder="Buscar zapatillas, marca, modelo..." />
    </div>
    <div class="header__acciones">
      <a class="btn-whatsapp" id="btn-whatsapp-header" href="#" target="_blank">
        💬 WhatsApp
      </a>
    </div>
  </div>
  <nav class="header__nav">
    <a href="index.html" class="activo">Inicio</a>
    <a href="#" data-categoria="todas">Catálogo</a>
    <a href="#" data-categoria="hombre">Hombre</a>
    <a href="#" data-categoria="mujer">Mujer</a>
    <a href="#" data-nuevo="1">Nuevos ingresos</a>
  </nav>
</header>

<section class="hero">
  <h1>Encuentra tu próximo par</h1>
  <p>Zapatillas originales con envío a toda Colombia</p>
</section>

<main class="contenido">

  <aside class="filtros">
    <h3>Género</h3>
    <div class="filtro-grupo" id="filtro-genero">
      <label><input type="checkbox" value="hombre" /> Hombre</label>
      <label><input type="checkbox" value="mujer" /> Mujer</label>
      <label><input type="checkbox" value="unisex" /> Unisex</label>
    </div>

    <h3>Marca</h3>
    <div class="filtro-grupo" id="filtro-marca">
      <!-- se llena dinámicamente desde app.js -->
    </div>

    <h3>Talla</h3>
    <div class="filtro-tallas" id="filtro-talla">
      <!-- se llena dinámicamente desde app.js -->
    </div>

    <h3>Precio</h3>
    <div class="filtro-grupo">
      <label>Hasta: <span id="precio-max-label"></span></label>
      <input type="range" id="precio-max" min="0" max="1000000" step="10000" />
    </div>

    <h3>Disponibilidad</h3>
    <div class="filtro-grupo">
      <label><input type="checkbox" id="filtro-nuevo" /> Solo nuevos ingresos</label>
    </div>

    <button class="btn-limpiar-filtros" id="btn-limpiar">Limpiar filtros</button>
  </aside>

  <section class="resultados">
    <div class="barra-resultados">
      <span class="barra-resultados__conteo" id="conteo-resultados">0 productos</span>
      <select class="orden-select" id="orden-select">
        <option value="relevancia">Más relevantes</option>
        <option value="precio-asc">Precio: menor a mayor</option>
        <option value="precio-desc">Precio: mayor a menor</option>
        <option value="nuevo">Más nuevos</option>
      </select>
    </div>

    <div class="grid-productos" id="grid-productos">
      <!-- productos renderizados por app.js -->
    </div>

    <div class="paginacion" id="paginacion"></div>
  </section>

</main>

<footer class="footer">
  <p class="footer__redes-label">Síguenos en redes</p>
  <div class="footer__redes">
    <a href="#" id="link-instagram" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 2.2c3.2 0 3.58.01 4.85.07 1.17.05 1.8.25 2.23.41.56.22.96.48 1.38.9.42.42.68.82.9 1.38.16.42.36 1.06.41 2.23.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.05 1.17-.25 1.8-.41 2.23-.22.56-.48.96-.9 1.38-.42.42-.82.68-1.38.9-.42.16-1.06.36-2.23.41-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-1.17-.05-1.8-.25-2.23-.41a3.72 3.72 0 0 1-1.38-.9 3.72 3.72 0 0 1-.9-1.38c-.16-.42-.36-1.06-.41-2.23-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85c.05-1.17.25-1.8.41-2.23.22-.56.48-.96.9-1.38.42-.42.82-.68 1.38-.9.42-.16 1.06-.36 2.23-.41 1.27-.06 1.65-.07 4.85-.07M12 0C8.74 0 8.33.01 7.05.07 5.78.13 4.9.33 4.14.63c-.8.31-1.48.72-2.15 1.39A5.9 5.9 0 0 0 .6 4.17c-.3.76-.5 1.64-.56 2.9C0 8.33 0 8.74 0 12s.01 3.67.07 4.95c.06 1.27.26 2.15.56 2.9.31.8.72 1.48 1.39 2.15.67.67 1.35 1.08 2.15 1.39.75.3 1.63.5 2.9.56C8.33 24 8.74 24 12 24s3.67-.01 4.95-.07c1.27-.06 2.15-.26 2.9-.56.8-.31 1.48-.72 2.15-1.39.67-.67 1.08-1.35 1.39-2.15.3-.75.5-1.63.56-2.9.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.06-1.27-.26-2.15-.56-2.9a5.9 5.9 0 0 0-1.39-2.15A5.9 5.9 0 0 0 19.85.63c-.75-.3-1.63-.5-2.9-.56C15.67.01 15.26 0 12 0Z"/><path d="M12 5.84A6.16 6.16 0 1 0 18.16 12 6.16 6.16 0 0 0 12 5.84Zm0 10.16A4 4 0 1 1 16 12a4 4 0 0 1-4 4Z"/><circle cx="18.41" cy="5.59" r="1.44"/></svg>

    <a href="#" id="link-facebook" target="_blank" rel="noopener" aria-label="Facebook">

    </a>
  </div>
  <p>© 2026 Chayron — Zapatillas originales en Colombia</p>
  <p>Contáctanos por <a href="#" id="btn-whatsapp-footer" target="_blank">WhatsApp</a></p>
</footer>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
