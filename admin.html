<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Panel Chayron</title>
  <style>
    :root { --negro:#0b0c0f; --plata:#9fb0c3; --borde:#e5e5e5; --suave:#6b6b6b; --ok:#1f9d55; --mal:#c0392b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background:#f4f5f7; color:#111; line-height:1.4; padding-bottom:60px; }
    header { background:var(--negro); color:#fff; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10; }
    header h1 { font-size:17px; letter-spacing:1px; }
    header button { color:var(--plata); background:none; border:none; font-size:13px; }
    main { max-width:560px; margin:0 auto; padding:16px; }
    .caja { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:16px; margin-bottom:16px; }
    h2 { font-size:16px; margin-bottom:12px; }
    label { display:block; font-size:13px; font-weight:600; margin:12px 0 5px; }
    label small { font-weight:400; color:var(--suave); }
    input, select { width:100%; padding:12px; border:1px solid #cfd3d8; border-radius:9px; font-size:16px; background:#fff; }
    .fila { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    button.principal { width:100%; margin-top:18px; padding:15px; border:none; border-radius:10px; background:var(--negro); color:#fff; font-size:16px; font-weight:700; }
    button.principal:disabled { opacity:.5; }
    .msg { margin-top:12px; font-size:14px; padding:10px 12px; border-radius:8px; display:none; }
    .msg.ok { display:block; background:#e6f6ec; color:#14653a; }
    .msg.mal { display:block; background:#fdeaea; color:var(--mal); }
    .msg.info { display:block; background:#eef2f7; color:#33445a; }
    .previas { display:flex; gap:8px; overflow-x:auto; margin-top:10px; }
    .previas img { width:70px; height:70px; object-fit:cover; border-radius:8px; border:1px solid var(--borde); flex-shrink:0; }
    .prod { display:flex; gap:12px; align-items:center; padding:10px 0; border-top:1px solid var(--borde); }
    .prod:first-of-type { border-top:none; }
    .prod img { width:56px; height:56px; object-fit:cover; border-radius:8px; background:#eee; flex-shrink:0; }
    .prod__info { flex:1; min-width:0; font-size:13px; }
    .prod__info b { display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .prod__acciones { display:flex; flex-direction:column; gap:5px; }
    .prod__acciones button { font-size:12px; padding:6px 9px; border-radius:7px; border:1px solid #cfd3d8; background:#fff; }
    .prod__acciones button.peligro { color:var(--mal); border-color:#e8bcb6; }
    .agotado { color:var(--mal); font-weight:700; }
    #login { max-width:380px; margin:60px auto; padding:0 16px; }
    .oculto { display:none !important; }
  </style>
</head>
<body>

<section id="login" class="oculto">
  <div class="caja">
    <h2>Panel Chayron</h2>
    <label for="email">Correo</label>
    <input type="email" id="email" autocomplete="username" />
    <label for="clave">Contraseña</label>
    <input type="password" id="clave" autocomplete="current-password" />
    <button class="principal" id="btn-entrar">Entrar</button>
    <div class="msg" id="msg-login"></div>
  </div>
</section>

<section id="panel" class="oculto">
  <header>
    <h1>CHAYRON · PANEL</h1>
    <button id="btn-salir">Salir</button>
  </header>
  <main>
    <div class="caja">
      <h2>Publicar un modelo nuevo</h2>

      <label for="marca">Marca</label>
      <select id="marca"></select>
      <input type="text" id="marca-otra" placeholder="Escribe la marca nueva" class="oculto" style="margin-top:8px" />

      <label for="modelo">Modelo</label>
      <input type="text" id="modelo" placeholder="Ej: Nike P-6000 Azul y Plateado" />

      <label for="precio">Precio en pesos <small>(solo números, ej: 175000)</small></label>
      <input type="text" id="precio" inputmode="numeric" placeholder="175000" />

      <div class="fila">
        <div>
          <label for="tallas-dama">Tallas dama <small>(opcional)</small></label>
          <input type="text" id="tallas-dama" placeholder="36 37 38 39" />
        </div>
        <div>
          <label for="tallas-cab">Tallas caballero <small>(opcional)</small></label>
          <input type="text" id="tallas-cab" placeholder="40 41 42 43 44" />
        </div>
      </div>

      <label for="fotos">Fotos <small>(la primera será la portada)</small></label>
      <input type="file" id="fotos" accept="image/*" multiple />
      <div class="previas" id="previas"></div>

      <button class="principal" id="btn-publicar">Publicar</button>
      <div class="msg" id="msg-pub"></div>
    </div>

    <div class="caja">
      <h2>Últimos modelos</h2>
      <div id="lista"><p style="color:#888;font-size:14px">Cargando...</p></div>
      <div class="msg" id="msg-lista"></div>
    </div>
  </main>
</section>

<script src="supabase.js"></script>
<script>
const BASE = SUPABASE_URL.replace('/rest/v1', '');
const BUCKET = 'productos-fotos';
const $ = id => document.getElementById(id);

// ---------- Sesión ----------
let sesion = null;
function guardarSesion(s) {
  sesion = s;
  try { s ? localStorage.setItem('chy_sesion', JSON.stringify(s)) : localStorage.removeItem('chy_sesion'); } catch (e) {}
}
function leerSesion() {
  try { return JSON.parse(localStorage.getItem('chy_sesion')); } catch (e) { return null; }
}
async function pedirToken(cuerpo, tipo) {
  const r = await fetch(`${BASE}/auth/v1/token?grant_type=${tipo}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(cuerpo),
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error_description || d.msg || 'No se pudo iniciar sesión');
  return { token: d.access_token, refresh: d.refresh_token, vence: Date.now() + (d.expires_in - 60) * 1000 };
}
async function tokenValido() {
  if (!sesion) throw new Error('Sesión cerrada');
  if (Date.now() > sesion.vence) {
    guardarSesion(await pedirToken({ refresh_token: sesion.refresh }, 'refresh_token'));
  }
  return sesion.token;
}
async function api(ruta, opciones = {}) {
  const token = await tokenValido();
  const r = await fetch(ruta, {
    ...opciones,
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, ...(opciones.headers || {}) },
  });
  if (!r.ok) {
    let t = ''; try { t = (await r.json()).message || ''; } catch (e) {}
    throw new Error(`${t || 'Error'} (${r.status})`);
  }
  return r;
}

function mostrar(id, tipo, texto) {
  const el = $(id); el.className = 'msg ' + tipo; el.textContent = texto;
}
function limpiar(id) { $(id).className = 'msg'; }

// ---------- Entrar / salir ----------
async function entrar() {
  $('btn-entrar').disabled = true; mostrar('msg-login', 'info', 'Entrando...');
  try {
    guardarSesion(await pedirToken({ email: $('email').value.trim(), password: $('clave').value }, 'password'));
    $('clave').value = '';
    await abrirPanel();
  } catch (e) {
    mostrar('msg-login', 'mal', e.message.includes('Invalid') ? 'Correo o contraseña incorrectos' : e.message);
  }
  $('btn-entrar').disabled = false;
}
async function abrirPanel() {
  $('login').classList.add('oculto');
  $('panel').classList.remove('oculto');
  await Promise.all([cargarMarcas(), cargarLista()]);
}
function salir() {
  guardarSesion(null);
  $('panel').classList.add('oculto');
  $('login').classList.remove('oculto');
}

// ---------- Datos ----------
let todos = [];
async function cargarTodos() {
  const r = await api(`${SUPABASE_URL}/productos?select=*&order=creado_en.desc`);
  todos = await r.json();
}
async function cargarMarcas() {
  if (!todos.length) await cargarTodos();
  const marcas = [...new Set(todos.map(p => p.marca).filter(Boolean))].sort();
  $('marca').innerHTML = marcas.map(m => `<option>${m}</option>`).join('') + '<option value="__otra">+ Otra marca...</option>';
}
$('marca').addEventListener('change', () => {
  $('marca-otra').classList.toggle('oculto', $('marca').value !== '__otra');
});

function siguienteSku() {
  const nums = todos.map(p => parseInt((p.sku || '').replace(/\D/g, ''), 10)).filter(n => !isNaN(n));
  const n = (nums.length ? Math.max(...nums) : 0) + 1;
  return 'CHY-' + String(n).padStart(3, '0');
}
function tallasTexto(t) {
  return t.split(/[\s,\/\-]+/).map(x => x.trim()).filter(Boolean).join(' / ');
}

// ---------- Fotos ----------
$('fotos').addEventListener('change', () => {
  $('previas').innerHTML = [...$('fotos').files].map(f => `<img src="${URL.createObjectURL(f)}" />`).join('');
});
function achicar(archivo, maximo = 1400, calidad = 0.85) {
  return new Promise((ok, fallo) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, maximo / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? ok(b) : fallo(new Error('No se pudo procesar una foto')), 'image/jpeg', calidad);
    };
    img.onerror = () => fallo(new Error('Una foto no se pudo leer'));
    img.src = URL.createObjectURL(archivo);
  });
}
async function subirFoto(nombre, blob) {
  await api(`${BASE}/storage/v1/object/${BUCKET}/${nombre}`, {
    method: 'POST',
    headers: { 'Content-Type': 'image/jpeg', 'x-upsert': 'true' },
    body: blob,
  });
  return `${BASE}/storage/v1/object/public/${BUCKET}/${nombre}`;
}

// ---------- Publicar ----------
async function publicar() {
  limpiar('msg-pub');
  const marca = ($('marca').value === '__otra' ? $('marca-otra').value : $('marca').value).trim();
  const modelo = $('modelo').value.trim();
  const precio = parseInt($('precio').value.replace(/\D/g, ''), 10);
  const dama = tallasTexto($('tallas-dama').value);
  const cab = tallasTexto($('tallas-cab').value);
  const fotos = [...$('fotos').files];

  if (!marca || !modelo) return mostrar('msg-pub', 'mal', 'Falta la marca o el modelo');
  if (!precio || precio < 1000) return mostrar('msg-pub', 'mal', 'Escribe el precio completo, por ejemplo 175000');
  if (!dama && !cab) return mostrar('msg-pub', 'mal', 'Escribe al menos unas tallas');
  if (!fotos.length) return mostrar('msg-pub', 'mal', 'Elige al menos una foto');

  $('btn-publicar').disabled = true;
  try {
    await cargarTodos();
    const sku = siguienteSku();
    const urls = [];
    for (let i = 0; i < fotos.length; i++) {
      mostrar('msg-pub', 'info', `Subiendo foto ${i + 1} de ${fotos.length}...`);
      const blob = await achicar(fotos[i]);
      urls.push(await subirFoto(i === 0 ? `${sku}.jpg` : `${sku}-${i + 1}.jpg`, blob));
    }
    mostrar('msg-pub', 'info', 'Guardando el producto...');
    await api(`${SUPABASE_URL}/productos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({
        sku, marca, modelo, categoria: 'zapatillas',
        tallas_dama: dama || null, tallas_caballero: cab || null, tallas_sin_genero: null,
        precio_soles: precio, stock: true,
        imagen_url: urls[0], imagenes_url: urls.join(','),
      }),
    });
    mostrar('msg-pub', 'ok', `Listo, publicado como ${sku}. Ya se ve en la tienda.`);
    ['modelo', 'precio', 'tallas-dama', 'tallas-cab', 'fotos'].forEach(id => $(id).value = '');
    $('previas').innerHTML = '';
    await cargarMarcas(); await cargarLista();
  } catch (e) {
    mostrar('msg-pub', 'mal', 'No se pudo publicar: ' + e.message);
  }
  $('btn-publicar').disabled = false;
}

// ---------- Lista ----------
async function cargarLista() {
  await cargarTodos();
  const cop = n => 'COP $' + Number(n).toLocaleString('es-CO');
  $('lista').innerHTML = todos.slice(0, 30).map(p => `
    <div class="prod">
      <img src="${p.imagen_url || ''}" alt="" loading="lazy" />
      <div class="prod__info"><b>${p.modelo}</b>${p.sku} · ${cop(p.precio_soles)}${p.stock ? '' : ' · <span class="agotado">AGOTADO</span>'}</div>
      <div class="prod__acciones">
        <button data-a="stock" data-id="${p.id}">${p.stock ? 'Marcar agotado' : 'Hay stock'}</button>
        <button data-a="precio" data-id="${p.id}">Cambiar precio</button>
        <button data-a="borrar" data-id="${p.id}" class="peligro">Eliminar</button>
      </div>
    </div>`).join('') || '<p style="color:#888;font-size:14px">Aún no hay productos.</p>';
}
$('lista').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.dataset.id; const p = todos.find(x => String(x.id) === id); if (!p) return;
  limpiar('msg-lista');
  try {
    if (b.dataset.a === 'stock') {
      await modificar(id, { stock: !p.stock });
    } else if (b.dataset.a === 'precio') {
      const nuevo = parseInt((prompt(`Nuevo precio para ${p.modelo} (solo números):`, p.precio_soles) || '').replace(/\D/g, ''), 10);
      if (!nuevo) return;
      await modificar(id, { precio_soles: nuevo });
    } else if (b.dataset.a === 'borrar') {
      if (!confirm(`¿Eliminar ${p.modelo} (${p.sku})? No se puede deshacer.`)) return;
      await api(`${SUPABASE_URL}/productos?id=eq.${id}`, { method: 'DELETE' });
    }
    await cargarLista();
  } catch (err) { mostrar('msg-lista', 'mal', err.message); }
});
async function modificar(id, datos) {
  await api(`${SUPABASE_URL}/productos?id=eq.${id}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json', Prefer: 'return=minimal' },
    body: JSON.stringify(datos),
  });
}

// ---------- Inicio ----------
$('btn-entrar').addEventListener('click', entrar);
$('clave').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
$('btn-salir').addEventListener('click', salir);
$('btn-publicar').addEventListener('click', publicar);

(async () => {
  const s = leerSesion();
  if (s) {
    sesion = s;
    try { await tokenValido(); await abrirPanel(); return; } catch (e) { guardarSesion(null); }
  }
  $('login').classList.remove('oculto');
})();
</script>
</body>
</html>
